name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    name: Mod index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_index.py mods/index.json
      - name: Check native health overlay (ARM64 with engine stubs)
        run: |
          python3 -m pip install unicorn==2.1.4
          python3 tests/test_health_overlay.py

  build:
    name: Switch build (.nro + .ovl)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: make -j"$(nproc)"
      - name: Build the overlay
        run: make -C overlay -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: switch-binaries
          path: |
            SwitchModHub.nro
            overlay/SwitchModHub.ovl
          if-no-files-found: error

  tests:
    name: PC tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core unzip openssl
          # AddressSanitizer needs the classic address space layout
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Run the tests
        run: bash tests/run_tests.sh
        env:
          SSE_FONTS: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          OUT: /tmp/sse_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: tests/out/

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [index, build, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: switch-binaries
          path: bin
      - name: Package
        run: python3 tools/package.py "${GITHUB_REF_NAME#v}" bin/SwitchModHub.nro bin/overlay/SwitchModHub.ovl dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Switch Mod Hub ${TAG#v}" --notes "Switch Mod Hub ${TAG#v}"
          gh release upload "$TAG" dist/* --clobber
